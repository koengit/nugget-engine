<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nuggets</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
</head>
<body>
<header id="top">
  <a id="site-title" href="#/">Nuggets</a>
  <nav>
    <a href="#/all">All nuggets</a>
    <a href="#/me">My notes</a>
  </nav>
  <input id="search" type="search" placeholder="Search…" aria-label="Search nuggets">
</header>
<main id="main"><p class="loading">Loading…</p></main>
<aside id="tray" hidden>
  <div class="tray-head">
    <strong>Composing a view</strong>
    <span id="tray-count"></span>
    <button id="tray-open">Open as one view</button>
    <button id="tray-save">Save as collection…</button>
    <button id="tray-clear" class="quiet">Clear</button>
  </div>
  <ol id="tray-list"></ol>
</aside>
<script src="app.js"></script>
</body>
</html>
